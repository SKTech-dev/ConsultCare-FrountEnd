name: Frontend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Validate Netlify production build and redirects
        run: npm run build:netlify
        env:
          BACKEND_ORIGIN: https://api.example.test
          VITE_API_BASE_URL: /api
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
  full-stack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: consultcare
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: consultcare
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      COOKIE_SECURE: 'false'
      CONSULTCARE_BACKEND_PATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - name: Check companion repository credentials
        env:
          COMPANION_REPO_TOKEN: ${{ secrets.CONSULTCARE_REPO_TOKEN }}
        run: |
          if [ -z "$COMPANION_REPO_TOKEN" ]; then
            echo '::error::Set the CONSULTCARE_REPO_TOKEN Actions secret with Contents read access to SKTech-dev/ConsultCare-BackEnd. The default GitHub token cannot read the private companion repository.'
            exit 1
          fi
      - name: Select companion revision
        id: companion
        uses: actions/github-script@v7
        env:
          COMPANION_REF_OVERRIDE: ${{ vars.CONSULTCARE_BACKEND_REF }}
        with:
          github-token: ${{ secrets.CONSULTCARE_REPO_TOKEN }}
          script: |
            const override = process.env.COMPANION_REF_OVERRIDE?.trim();
            const branch = context.payload.pull_request?.head.ref || context.ref.replace(/^refs\/heads\//, '');
            const fallback = context.payload.pull_request?.base.ref || 'development';
            // Release checks must test the deployed companion, not a stale feature override.
            const stable = context.payload.pull_request?.base.ref === 'main'
              ? 'main'
              : !context.payload.pull_request && ['main', 'development'].includes(branch)
                ? branch : null;
            if (stable && override) {
              core.warning(`Ignoring CONSULTCARE_BACKEND_REF=${override} for ${stable} checks.`);
            }
            let ref = stable || override || fallback;
            if (!stable && !override && branch) {
              try {
                await github.rest.repos.getBranch({ owner: 'SKTech-dev', repo: 'ConsultCare-BackEnd', branch });
                ref = branch;
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info(`No matching companion branch ${branch}; using ${fallback}.`);
              }
            }
            core.info(`Companion revision: ${ref}`);
            core.setOutput('ref', ref);
      - uses: actions/checkout@v4
        with:
          repository: SKTech-dev/ConsultCare-BackEnd
          ref: ${{ steps.companion.outputs.ref }}
          path: backend
          token: ${{ secrets.CONSULTCARE_REPO_TOKEN }}
      - name: Validate companion backend
        run: >-
          test -f backend/tests/run_e2e.py ||
          { echo 'The selected companion backend has no full-stack runner. Check the Select companion revision log. For a release, merge backend/tests/run_e2e.py into backend main first; for feature checks, correct CONSULTCARE_BACKEND_REF.'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci
      - run: python -m pip install -c requirements.lock -e '.[dev]'
        working-directory: backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-stack-failure
          path: e2e-artifacts/
