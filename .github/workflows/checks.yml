name: Frontend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
  full-stack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: consultcare
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: consultcare
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      COOKIE_SECURE: 'false'
      CONSULTCARE_BACKEND_PATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SKTech-dev/ConsultCare-BackEnd
          # Paired PRs use the same source branch; pushes use the current branch.
          ref: ${{ vars.CONSULTCARE_BACKEND_REF || github.head_ref || github.ref_name }}
          path: backend
          token: ${{ secrets.CONSULTCARE_REPO_TOKEN || github.token }}
      - name: Validate companion backend
        run: >-
          test -f backend/tests/run_e2e.py ||
          { echo 'The selected backend revision has no full-stack runner. Push the matching backend branch, or set CONSULTCARE_BACKEND_REF to its branch or SHA.'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -c requirements.lock -e '.[dev]'
        working-directory: backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-stack-failure
          path: e2e-artifacts/
